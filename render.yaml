services:
  - type: web
    name: smart-eco-vri
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers 2 --timeout 120 --access-logfile - --bind 0.0.0.0:$PORT wsgi:app
    healthCheckPath: /healthz
    envVars:
      - key: APP_ENV
        value: production
      - key: TRUST_PROXY
        value: "true"
      - key: SECRET_KEY
        generateValue: true
      - key: ECOVRI_DATA_DIR
        value: /var/data
    disk:
      name: ecovri-data
      mountPath: /var/data
      sizeGB: 1
