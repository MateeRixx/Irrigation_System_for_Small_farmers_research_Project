services:
  web:
    build: .
    ports:
      - "8000:8000"
    environment:
      APP_ENV: production
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
      TRUST_PROXY: "false"
      ECOVRI_DATA_DIR: /var/lib/ecovri
    volumes:
      - ecovri_data:/var/lib/ecovri
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  ecovri_data:
