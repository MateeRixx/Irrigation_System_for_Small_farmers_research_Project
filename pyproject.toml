[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "smart-eco-vri"
version = "0.1.0"
description = "Satellite-driven irrigation zoning for smallholder farms"
requires-python = ">=3.10"
dependencies = [
    "Flask>=3.0",
    "flask-login>=0.6",
    "opencv-python-headless>=4.8",
    "numpy>=1.26",
    "scikit-learn>=1.3",
    "Werkzeug>=3.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
